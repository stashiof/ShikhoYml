          python3 - << 'EOF'
          import os, re, urllib.request, gdown
          from PIL import Image

          def download_asset(url_str, out_path):
              url = url_str.strip()
              match = re.search(r'[-\w]{25,}', url)
              if match and ("drive.google.com" in url or not url.startswith("http")):
                  try:
                      gdown.download(id=match.group(0), output=out_path, quiet=False)
                      if os.path.exists(out_path) and os.path.getsize(out_path) > 0:
                          return True
                  except Exception:
                      pass
              try:
                  req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
                  with urllib.request.urlopen(req) as resp, open(out_path, 'wb') as f:
                      f.write(resp.read())
                  if os.path.exists(out_path) and os.path.getsize(out_path) > 0:
                      return True
              except Exception:
                  pass
              return False

          icon_url = """${{ github.event.inputs.icon_url }}""".strip()
          icon_src = "app_icon.png"

          if not download_asset(icon_url, icon_src):
              print("Icon download skipped or failed.")
              exit(0)

          for root, dirs, files in os.walk("decompiled_app/res"):
              if "anydpi" in root:
                  for f in files:
                      if "ic_launcher" in f and f.endswith(".xml"):
                          try:
                              os.remove(os.path.join(root, f))
                          except:
                              pass

          try:
              orig = Image.open(icon_src).convert("RGBA")
              sizes = {
                  "mipmap-mdpi": (48, 48), "mipmap-hdpi": (72, 72),
                  "mipmap-xhdpi": (96, 96), "mipmap-xxhdpi": (144, 144),
                  "mipmap-xxxhdpi": (192, 192), "drawable": (192, 192)
              }
              for folder, size in sizes.items():
                  dir_path = os.path.join("decompiled_app/res", folder)
                  if os.path.exists(dir_path):
                      resized = orig.resize(size, Image.Resampling.LANCZOS)
                      for name in ["ic_launcher.png", "ic_launcher_round.png", "icon.png"]:
                          resized.save(os.path.join(dir_path, name), format="PNG", optimize=True)
              print("Icon successfully updated.")
          except Exception as e:
              print(f"Icon update error: {e}")
          EOF

