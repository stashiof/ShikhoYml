name: Ultimate App Modder 🚀

on:
  workflow_dispatch:
    inputs:
      source_type:
        description: 'অ্যাপ কোথা থেকে ডাউনলোড করবেন?'
        required: true
        type: choice
        options:
          - 'GoogleDrive'
          - 'PlayStore'
        default: 'GoogleDrive'
      app_identifier:
        description: 'Google Drive Link অথবা Play Store Link / Package Name'
        required: true
        type: string
        default: 'tech.shikho.android'
      build_target:
        description: 'কোন ভার্সনটি বিল্ড করতে চান?'
        required: true
        type: choice
        options:
          - 'Both (Original & Clone)'
          - 'Original Only'
          - 'Clone Only'
        default: 'Both (Original & Clone)'
      clone_config:
        description: 'ক্লোন ভার্সনের সেটিংস কেমন হবে?'
        required: true
        type: choice
        options:
          - 'Same as Original'
          - 'Customized'
        default: 'Same as Original'
      clone_package_name:
        description: 'ক্লোন অ্যাপের প্যাকেজ নেম (কাস্টমাইজ করতে চাইলে)'
        required: false
        type: string
        default: 'tech.shikho.mod'
      clone_app_name:
        description: 'ক্লোন অ্যাপের নাম (Customized সিলেক্ট করলে প্রযোজ্য)'
        required: false
        type: string
        default: 'MaxBird'
      unlock_premium:
        description: 'সব প্রিমিয়াম ফিচার আনলক করবেন?'
        required: true
        type: boolean
        default: true
      bypass_secure:
        description: 'স্ক্রিনশট/রেকর্ড রেস্ট্রিকশন ভাঙতে চান?'
        required: true
        type: boolean
        default: true
      slim_apk:
        description: 'x86/x86_64 লাইব্রেরি মুছে APK সাইজ ছোট করবেন?'
        required: true
        type: boolean
        default: true
      change_name:
        description: 'অরিজিনাল অ্যাপের নাম পরিবর্তন করবেন?'
        required: true
        type: boolean
        default: false
      new_app_name:
        description: 'অরিজিনাল অ্যাপের নতুন নাম'
        required: false
        type: string
        default: 'Modded App'
      change_icon:
        description: 'অ্যাপের লোগো পরিবর্তন করবেন?'
        required: true
        type: boolean
        default: false
      icon_url:
        description: 'নতুন লোগোর লিংক (Direct URL বা Google Drive Link)'
        required: false
        type: string
      change_vectors:
        description: 'কাস্টম ভেক্টর লোগো যুক্ত করবেন?'
        required: true
        type: boolean
        default: true
      vector_logo_url:
        description: 'ভেক্টর লোগোর .xml ফাইলের লিংক (Google Drive বা Direct URL - ফাঁকা রাখলে ডিফল্ট গোল্ডেন শিল্ড)'
        required: false
        type: string
        default: ''
      change_onboarding:
        description: 'অনবোর্ডিং ইমেজ পরিবর্তন করবেন?'
        required: true
        type: boolean
        default: false
      onboarding_img_1:
        description: 'Onboarding Image 1 URL (Direct বা Google Drive)'
        required: false
        type: string
      onboarding_img_2:
        description: 'Onboarding Image 2 URL (Direct বা Google Drive)'
        required: false
        type: string
      onboarding_img_3:
        description: 'Onboarding Image 3 URL (Direct বা Google Drive)'
        required: false
        type: string
      add_welcome_dialog:
        description: 'ওয়েলকাম ও ডিসক্লেমার ডায়ালগ যুক্ত করবেন?'
        required: true
        type: boolean
        default: true
      mod_author:
        description: 'মোডার বা ডেভেলপারের নাম'
        required: false
        type: string
        default: 'Fahim'
      telegram_link:
        description: 'টেলিগ্রাম চ্যানেল বা গ্রুপের লিংক'
        required: false
        type: string
        default: 'https://t.me/'

jobs:
  build_mod:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java & Python
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Cache Tools & Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/apkeep
            tools_cache
            ~/.cache/pip
          key: mod-tools-${{ runner.os }}-v1

      - name: Install Tools
        run: |
          sudo apt-get update && sudo apt-get install -y wget curl zip unzip xmlstarlet
          pip install --upgrade gdown pillow requests

          mkdir -p tools_cache
          cd tools_cache

          [ ! -f "APKEditor.jar" ] && wget -q -O APKEditor.jar https://github.com/REAndroid/APKEditor/releases/download/V1.4.1/APKEditor-1.4.1.jar
          [ ! -f "apktool.jar" ] && wget -q -O apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar
          [ ! -f "uber-apk-signer.jar" ] && wget -q -O uber-apk-signer.jar https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar

          cp APKEditor.jar apktool.jar uber-apk-signer.jar $GITHUB_WORKSPACE/
          cd $GITHUB_WORKSPACE

      - name: Download & Merge APK
        run: |
          RAW_INPUT="${{ github.event.inputs.app_identifier }}"
          
          if [ "${{ github.event.inputs.source_type }}" == "PlayStore" ]; then
            if ! command -v apkeep &> /dev/null; then
              echo "Installing apkeep via cargo..."
              cargo install apkeep
            fi
            
            if [[ "$RAW_INPUT" =~ id=([a-zA-Z0-9._]+) ]]; then
              PKG_NAME="${BASH_REMATCH[1]}"
            else
              PKG_NAME=$(echo "$RAW_INPUT" | sed -e 's/[[:space:]]//g')
            fi
            
            echo "Downloading package [$PKG_NAME] from Play Store..."
            mkdir -p downloaded_apks
            apkeep -a "$PKG_NAME" downloaded_apks/
            
            apks_file=$(find downloaded_apks -type f -name "*.apks" | head -n 1)
            xapk_file=$(find downloaded_apks -type f -name "*.xapk" | head -n 1)
            apk_count=$(find downloaded_apks -name "*.apk" | wc -l)
            
            if [ -n "$apks_file" ]; then
              java -jar APKEditor.jar m -i "$apks_file" -o universal.apk
            elif [ -n "$xapk_file" ]; then
              java -jar APKEditor.jar m -i "$xapk_file" -o universal.apk
            elif [ "$apk_count" -gt "1" ]; then
              cd downloaded_apks
              zip -q -r ../app.apks $(find . -name "*.apk")
              cd ..
              java -jar APKEditor.jar m -i app.apks -o universal.apk
            elif [ "$apk_count" -eq "1" ]; then
              find downloaded_apks -name "*.apk" -exec cp {} universal.apk \;
            else
              echo "Error: Play Store থেকে APK নামানো যায়নি।"
              exit 1
            fi
          else
            echo "Downloading from Google Drive..."
            python3 - << 'PYEOF'
          import gdown, re, os, sys

          raw_input = """${{ github.event.inputs.app_identifier }}""".strip()
          output = "downloaded_drive_file"

          match = re.search(r'[-\w]{25,}', raw_input)
          if match:
              file_id = match.group(0)
              print(f"Extracted Google Drive File ID: {file_id}")
              gdown.download(id=file_id, output=output, quiet=False)
          else:
              print(f"Downloading directly from URL: {raw_input}")
              gdown.download(url=raw_input, output=output, quiet=False)

          if not os.path.exists(output) or os.path.getsize(output) == 0:
              print("::error::Google Drive থেকে ফাইল নামানো যায়নি। লিঙ্ক পারমিশন নিশ্চিত করুন।")
              sys.exit(1)
          PYEOF

            echo "Checking file type..."
            if java -jar APKEditor.jar m -i downloaded_drive_file -o universal.apk; then
              echo "Bundle merged successfully into universal.apk"
            else
              echo "Standard APK detected, copying to universal.apk..."
              cp downloaded_drive_file universal.apk
            fi
          fi

      - name: Decompile APK
        run: |
          echo "Decompiling APK..."
          java -jar apktool.jar d universal.apk -o decompiled_app -f

      - name: Dynamic Architecture Slimming (Size Reduction)
        if: ${{ github.event.inputs.slim_apk == 'true' }}
        run: |
          echo "Slimming APK: Removing x86 and x86_64 binaries..."
          rm -rf decompiled_app/lib/x86 decompiled_app/lib/x86_64 decompiled_app/lib/mips* || true

      - name: Premium Features Unlock (Complete Unified Patch)
        if: ${{ github.event.inputs.unlock_premium == 'true' }}
        run: |
          echo "Applying Unified Smali Patches..."
          python3 - << 'EOF'
          import os, re

          target_files = [
              "slh.smali", "er6.smali", "zd6.smali", "tq6.smali", "sd6.smali",
              "n4.smali", "h7c.smali", "u7c.smali", "h30.smali", "b46.smali",
              "d43.smali", "lu5.smali", "d8c.smali", "m7c.smali", "ejc.smali"
          ]

          for root, dirs, files in os.walk("decompiled_app"):
              for file in files:
                  if file not in target_files: 
                      continue
                  filepath = os.path.join(root, file)
                  with open(filepath, "r", encoding="utf-8") as f:
                      c = f.read()
                  orig = c

                  # 1. slh.smali -> Routing Logic[span_1](start_span)[span_1](end_span)
                  if file == "slh.smali":
                      c = re.sub(
                          r'(iget-boolean ([vp]\d+), ([vp]\d+), Lz19;->o0:Z\s+if-eqz \2, (:cond_\w+))\s+(:cond_\w+)',
                          r'\1\n    return-void\n\n    \5',
                          c
                      )
                      c = re.sub(
                          r'(iget-boolean ([vp]\d+), ([vp]\d+), Lz19;->o0:Z\s+if-eqz \2, :cond_\w+\s+)goto :goto_\w+',
                          r'\1goto :cond_2af',
                          c
                      )
                      c = re.sub(r'if-eqz ([vp]\d+), :cond_23d', r'# bypassed if-eqz \1, :cond_23d', c)
                      c = re.sub(r'if-eqz ([vp]\d+), :cond_2ac', r'# bypassed if-eqz \1, :cond_2ac', c)

                  # 2 & 3. er6.smali, zd6.smali -> Access Level[span_2](start_span)[span_2](end_span)
                  elif file == "er6.smali":
                      c = re.sub(r'check-cast ([vp]\d+), Ljava/lang/String;', r'const-string \1, "Full"', c, count=1)
                  elif file == "zd6.smali":
                      c = re.sub(r'check-cast ([vp]\d+), Ljava/lang/String;', r'const-string \1, "Full"', c, count=1)

                  # 4 & 5. tq6.smali, sd6.smali -> Constructors[span_3](start_span)[span_3](end_span)
                  elif file == "tq6.smali":
                      c = re.sub(
                          r'iput-object ([vp]\d+), ([vp]\d+), Ltq6;->a:Ljava/lang/String;',
                          r'const-string \1, "Full"\n    iput-object \1, \2, Ltq6;->a:Ljava/lang/String;',
                          c
                      )
                  elif file == "sd6.smali":
                      c = re.sub(
                          r'iput-object ([vp]\d+), ([vp]\d+), Lsd6;->a:Ljava/lang/String;',
                          r'const-string \1, "Full"\n    iput-object \1, \2, Lsd6;->a:Ljava/lang/String;',
                          c
                      )

                  # 6. n4.smali -> Academic Program Model[span_4](start_span)[span_4](end_span)
                  elif file == "n4.smali":
                      c = re.sub(r'iput-boolean ([vp]\d+), ([vp]\d+), Ln4;->l:Z', r'const/4 \1, 0x0\n    iput-boolean \1, \2, Ln4;->l:Z', c)
                      c = re.sub(r'iput-boolean ([vp]\d+), ([vp]\d+), Ln4;->m:Z', r'const/4 \1, 0x0\n    iput-boolean \1, \2, Ln4;->m:Z', c)
                      c = re.sub(r'iput-boolean ([vp]\d+), ([vp]\d+), Ln4;->t:Z', r'const/4 \1, 0x1\n    iput-boolean \1, \2, Ln4;->t:Z', c)
                      c = re.sub(r'iput-boolean ([vp]\d+), ([vp]\d+), Ln4;->u:Z', r'const/4 \1, 0x0\n    iput-boolean \1, \2, Ln4;->u:Z', c)
                      c = re.sub(r'iput-boolean ([vp]\d+), ([vp]\d+), Ln4;->v:Z', r'const/4 \1, 0x0\n    iput-boolean \1, \2, Ln4;->v:Z', c)
                      c = re.sub(r'iput-boolean ([vp]\d+), ([vp]\d+), Ln4;->w:Z', r'const/4 \1, 0x1\n    iput-boolean \1, \2, Ln4;->w:Z', c)
                      c = re.sub(r'iput-boolean ([vp]\d+), ([vp]\d+), Ln4;->p:Z', r'const/4 \1, 0x1\n    iput-boolean \1, \2, Ln4;->p:Z', c)
                      c = re.sub(r'iput-object ([vp]\d+), ([vp]\d+), Ln4;->h:Ljava/lang/String;', r'const-string \1, "Full"\n    iput-object \1, \2, Ln4;->h:Ljava/lang/String;', c)
                      c = re.sub(r'iput-object ([vp]\d+), ([vp]\d+), Ln4;->g:Ljava/lang/Boolean;', r'sget-object \1, Ljava/lang/Boolean;->FALSE:Ljava/lang/Boolean;\n    iput-object \1, \2, Ln4;->g:Ljava/lang/Boolean;', c)

                  # 7. h7c.smali -> Quarter Model[span_5](start_span)[span_5](end_span)
                  elif file == "h7c.smali":
                      c = re.sub(
                          r'iput-object ([vp]\d+), ([vp]\d+), Lh7c;->f:Ljava/lang/Boolean;',
                          r'sget-object \1, Ljava/lang/Boolean;->TRUE:Ljava/lang/Boolean;\n    iput-object \1, \2, Lh7c;->f:Ljava/lang/Boolean;',
                          c
                      )
                      c = re.sub(
                          r'iput-object ([vp]\d+), ([vp]\d+), Lh7c;->g:Ljava/lang/Boolean;',
                          r'sget-object \1, Ljava/lang/Boolean;->FALSE:Ljava/lang/Boolean;\n    iput-object \1, \2, Lh7c;->g:Ljava/lang/Boolean;',
                          c
                      )
                      c = re.sub(
                          r'iput-object ([vp]\d+), ([vp]\d+), Lh7c;->n:Ljava/lang/Boolean;',
                          r'sget-object \1, Ljava/lang/Boolean;->FALSE:Ljava/lang/Boolean;\n    iput-object \1, \2, Lh7c;->n:Ljava/lang/Boolean;',
                          c
                      )

                  # 8. u7c.smali -> Quarter Pricing Model[span_6](start_span)[span_6](end_span)
                  elif file == "u7c.smali":
                      c = re.sub(
                          r'iput-object ([vp]\d+), ([vp]\d+), Lu7c;->a:Ljava/lang/Boolean;',
                          r'sget-object \1, Ljava/lang/Boolean;->TRUE:Ljava/lang/Boolean;\n    iput-object \1, \2, Lu7c;->a:Ljava/lang/Boolean;',
                          c
                      )
                      c = re.sub(
                          r'iput-object ([vp]\d+), ([vp]\d+), Lu7c;->d:Ljava/lang/Boolean;',
                          r'sget-object \1, Ljava/lang/Boolean;->FALSE:Ljava/lang/Boolean;\n    iput-object \1, \2, Lu7c;->d:Ljava/lang/Boolean;',
                          c
                      )

                  # 9. h30.smali -> AppPreference (Access level "Full")[span_7](start_span)[span_7](end_span)
                  elif file == "h30.smali":
                      c = re.sub(
                          r'\.method public final d\(\)Ljava/lang/String;.*?\.end method',
                          '.method public final d()Ljava/lang/String;\n    .registers 2\n    const-string v0, "Full"\n    return-object v0\n.end method',
                          c,
                          flags=re.DOTALL
                      )
                      c = re.sub(
                          r'\.method public final y\(\)I.*?\.end method',
                          '.method public final y()I\n    .registers 2\n    const v0, 0x7fffffff\n    return v0\n.end method',
                          c,
                          flags=re.DOTALL
                      )

                  # 10 & 12. b46.smali, lu5.smali -> Active Subscription Deserializers[span_8](start_span)[span_8](end_span)
                  elif file == "b46.smali":
                      c = re.sub(r'check-cast ([vp]\d+), Ljava/lang/Boolean;', r'sget-object \1, Ljava/lang/Boolean;->TRUE:Ljava/lang/Boolean;', c)
                  elif file == "lu5.smali":
                      c = re.sub(r'check-cast ([vp]\d+), Ljava/lang/Boolean;', r'sget-object \1, Ljava/lang/Boolean;->TRUE:Ljava/lang/Boolean;', c)

                  # 11. d43.smali -> Lesson Click Access Level[span_9](start_span)[span_9](end_span)
                  elif file == "d43.smali":
                      c = re.sub(
                          r'invoke-virtual \{([vp]\d+), ([vp]\d+)\}, Lh30;->C\(Ljava/lang/String;\)V',
                          r'const-string \2, "Full"\n    invoke-virtual {\1, \2}, Lh30;->C(Ljava/lang/String;)V',
                          c
                      )

                  # 13 & 14. d8c.smali, m7c.smali -> Course Enrollment Parsers[span_10](start_span)[span_10](end_span)
                  elif file == "d8c.smali":
                      c = re.sub(r'check-cast ([vp]\d+), Ljava/lang/Boolean;', r'sget-object \1, Ljava/lang/Boolean;->TRUE:Ljava/lang/Boolean;', c)
                      c = re.sub(r'check-cast ([vp]\d+), Ljava/lang/Boolean;', r'sget-object \1, Ljava/lang/Boolean;->FALSE:Ljava/lang/Boolean;', c)
                  elif file == "m7c.smali":
                      c = re.sub(r'check-cast ([vp]\d+), Ljava/lang/Boolean;', r'sget-object \1, Ljava/lang/Boolean;->TRUE:Ljava/lang/Boolean;', c)
                      c = re.sub(r'check-cast ([vp]\d+), Ljava/lang/Boolean;', r'sget-object \1, Ljava/lang/Boolean;->FALSE:Ljava/lang/Boolean;', c)
                      c = re.sub(r'check-cast ([vp]\d+), Ljava/lang/Boolean;', r'sget-object \1, Ljava/lang/Boolean;->FALSE:Ljava/lang/Boolean;', c)

                  # 15. ejc.smali -> Profile Quarter Card View Holder[span_11](start_span)[span_11](end_span)
                  elif file in ["ejc.smali", "Lejc.smali"]:
                      c = c.replace('const v6, 0x7f1403d0', 'const v6, 0x7f140047')
                      c = c.replace('const v8, 0x7f0600fd', 'const v8, 0x7f0604fd')
                      c = c.replace('const v6, 0x7f0604dd', 'const v6, 0x7f060547')
                      c = c.replace('const v6, 0x7f0808e7', 'const v6, 0x7f0808e8')

                  if c != orig:
                      with open(filepath, "w", encoding="utf-8") as f:
                          f.write(c)
                      print(f"-> Safely Patched {file}")
          EOF

      - name: Patch FLAG_SECURE (Screenshot/Record Enable)
        if: ${{ github.event.inputs.bypass_secure == 'true' }}
        run: |
          echo "Bypassing FLAG_SECURE..."
          python3 - << 'EOF'
          import os, re
          from concurrent.futures import ThreadPoolExecutor

          def patch_file(fp):
              try:
                  with open(fp, "r", encoding="utf-8", errors="ignore") as f:
                      content = f.read()
                  if "setFlags(II)V" in content or "addFlags(I)V" in content:
                      n_content = re.sub(
                          r'([ \t]*invoke-virtual \{[^}]+\}, Landroid/view/Window;->(setFlags\(II\)|addFlags\(I\))V)',
                          r'# \1',
                          content
                      )
                      if n_content != content:
                          with open(fp, "w", encoding="utf-8") as f:
                              f.write(n_content)
                          return True
              except Exception:
                  pass
              return False

          targets = []
          for root, dirs, files in os.walk("decompiled_app"):
              for file in files:
                  if file.endswith(".smali"):
                      targets.append(os.path.join(root, file))

          with ThreadPoolExecutor(max_workers=8) as ex:
              res = list(ex.map(patch_file, targets))
          print(f"FLAG_SECURE disabled across {sum(res)} smali files.")
          EOF

      - name: Replace Brand Vectors (Google Drive Link or Default Golden Shield)
        if: ${{ github.event.inputs.change_vectors == 'true' }}
        run: |
          echo "Replacing vector drawables..."
          python3 - << 'EOF'
          import os, re, urllib.request, gdown

          raw_url = """${{ github.event.inputs.vector_logo_url }}""".strip()
          downloaded = False
          out_file = "downloaded_vector.xml"

          if raw_url:
              match = re.search(r'[-\w]{25,}', raw_url)
              if match and ("drive.google.com" in raw_url or not raw_url.startswith("http")):
                  try:
                      gdown.download(id=match.group(0), output=out_file, quiet=False)
                      if os.path.exists(out_file) and os.path.getsize(out_file) > 0:
                          downloaded = True
                  except Exception as e:
                      print(f"gdown drive download failed: {e}")
              if not downloaded:
                  try:
                      req = urllib.request.Request(raw_url, headers={'User-Agent': 'Mozilla/5.0'})
                      with urllib.request.urlopen(req) as resp, open(out_file, 'wb') as f:
                          f.write(resp.read())
                      if os.path.exists(out_file) and os.path.getsize(out_file) > 0:
                          downloaded = True
                  except Exception as e:
                      print(f"Direct download failed: {e}")

          if downloaded:
              with open(out_file, "r", encoding="utf-8", errors="ignore") as f:
                  vector_content = f.read().strip()
              print("-> Custom Vector Logo applied from Google Drive / URL.")
          else:
              print("-> Using Default Built-in Golden Shield Vector.")
              vector_content = """<vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="242dp"
              android:height="290dp"
              android:viewportWidth="400"
              android:viewportHeight="480">
              <path android:fillColor="#0A0616" android:pathData="M200,20 L350,75 L375,260 L350,400 L200,470 L50,400 L25,260 L50,75 Z" />
