      - name: Build Strategy with Clean Isolation (Original & Clone)
        run: |
          mkdir -p output_unsigned output_signed
          TARGET="${{ github.event.inputs.build_target }}"

          if [ "${{ github.event.inputs.change_name }}" == "true" ]; then
            echo "Renaming Original App..."
            find decompiled_app/res/values* -type f -name "strings.xml" -exec sed -i 's/<string name="app_name">.*<\/string>/<string name="app_name">${{ github.event.inputs.new_app_name }}<\/string>/g' {} +
          fi

          build_original() {
            echo "--- Rebuilding Original Modded APK ---"
            java -jar apktool.jar b decompiled_app -o output_unsigned/modded_original.apk --use-aapt2
          }

          apply_hardcore_clone() {
            echo "--- Applying True Zero-Conflict Hardcore Clone Engine on Isolated Directory ---"
            rm -rf decompiled_clone
            cp -r decompiled_app decompiled_clone

            python3 - << 'PYEOF'
          import os, re
          import xml.etree.ElementTree as ET

          decompiled_dir = "decompiled_clone"
          manifest_path = os.path.join(decompiled_dir, "AndroidManifest.xml")
          
          with open(manifest_path, "r", encoding="utf-8") as f:
              m_str = f.read()

          orig_pkg = re.search(r'package="([^"]+)"', m_str).group(1)
          clone_pkg = """${{ github.event.inputs.clone_package_name }}""".strip() or f"{orig_pkg}.clone"
          clone_name = """${{ github.event.inputs.clone_app_name }}""".strip() if """${{ github.event.inputs.clone_config }}""" == "Customized" else ""

          print(f"Original Package: {orig_pkg}")
          print(f"Applying Clone Package: {clone_pkg}")

          def lock_components(m):
              name = m.group(2)
              if name.startswith('.'):
                  return f'{m.group(1)}="{orig_pkg}{name}"'
              elif '.' not in name:
                  return f'{m.group(1)}="{orig_pkg}.{name}"'
              return m.group(0)

          m_str = re.sub(r'(android:name)="([^"]+)"', lock_components, m_str)
          m_str = re.sub(r'package="[^"]+"', f'package="{clone_pkg}"', m_str, count=1)
          m_str = re.sub(r'(<permission[^>]+android:name=")' + re.escape(orig_pkg), r'\1' + clone_pkg, m_str)
          m_str = re.sub(r'(<uses-permission[^>]+android:name=")' + re.escape(orig_pkg), r'\1' + clone_pkg, m_str)

          def fix_authorities(m):
              raw = m.group(1)
              parts = [p.strip() for p in raw.split(';') if p.strip()]
              new_parts = []
              for p in parts:
                  if orig_pkg in p:
                      p = p.replace(orig_pkg, clone_pkg)
                  elif not p.startswith(clone_pkg):
                      p = f"{clone_pkg}.{p}"
                  new_parts.append(p)
              return f'android:authorities="{";".join(new_parts)}"'

          m_str = re.sub(r'android:authorities="([^"]+)"', fix_authorities, m_str)

          with open(manifest_path, "w", encoding="utf-8") as f:
              f.write(m_str)

          apktool_yml = os.path.join(decompiled_dir, "apktool.yml")
          if os.path.exists(apktool_yml):
              with open(apktool_yml, "r", encoding="utf-8") as f:
                  ay = f.read()
              ay = re.sub(r'renameManifestPackage:.*', f'renameManifestPackage: {clone_pkg}', ay)
              ay = re.sub(r'cur_package:.*', f'cur_package: {clone_pkg}', ay)
              with open(apktool_yml, "w", encoding="utf-8") as f:
                  f.write(ay)

          for root, dirs, files in os.walk(decompiled_dir):
              for file in files:
                  if file.endswith(".smali"):
                      sp = os.path.join(root, file)
                      with open(sp, "r", encoding="utf-8") as sf:
                          sc = sf.read()
                      nsc = sc.replace(f'"{orig_pkg}.fileprovider"', f'"{clone_pkg}.fileprovider"')
                      nsc = nsc.replace(f'"{orig_pkg}.androidx-startup"', f'"{clone_pkg}.androidx-startup"')
                      nsc = nsc.replace(f'"{orig_pkg}.provider"', f'"{clone_pkg}.provider"')
                      if nsc != sc:
                          with open(sp, "w", encoding="utf-8") as sf:
                              sf.write(nsc)

          if clone_name:
              for root, dirs, files in os.walk(os.path.join(decompiled_dir, "res")):
                  if os.path.basename(root).startswith("values") and "strings.xml" in files:
                      sp = os.path.join(root, "strings.xml")
                      with open(sp, "r", encoding="utf-8") as sf:
                          st = sf.read()
                      st = re.sub(r'<string name="app_name">.*?</string>', f'<string name="app_name">{clone_name}</string>', st)
                      with open(sp, "w", encoding="utf-8") as sf:
                          sf.write(st)
              print(f"Clone App Name set to: {clone_name}")

          print("-> Hardcore Clone applied successfully with zero package conflict!")
          PYEOF

            echo "--- Rebuilding Clone Modded APK ---"
            java -jar apktool.jar b decompiled_clone -o output_unsigned/modded_clone.apk --use-aapt2
          }

          if [ "$TARGET" == "Both (Original & Clone)" ]; then
            build_original
            apply_hardcore_clone
          elif [ "$TARGET" == "Original Only" ]; then
            build_original
          elif [ "$TARGET" == "Clone Only" ]; then
            apply_hardcore_clone
          fi

      - name: Sign Modded APKs
        run: |
          echo "Signing generated APKs..."
          for apk in output_unsigned/*.apk; do
            if [ -f "$apk" ]; then
              java -jar uber-apk-signer.jar -a "$apk" -o output_signed/
            fi
          done

      - name: Upload Final Modded APKs
        uses: actions/upload-artifact@v4
        with:
          name: Ultimate-Modded-APKs
          path: output_signed/*.apk
