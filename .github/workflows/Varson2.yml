      - name: Replace Brand Vectors (Via Drive / URL Only)
        if: ${{ github.event.inputs.change_vectors == 'true' && github.event.inputs.vector_logo_url != '' }}
        run: |
          echo "Downloading and replacing Vector Drawables..."
          python3 - << 'EOF'
          import os, re, urllib.request, gdown

          raw_url = """${{ github.event.inputs.vector_logo_url }}""".strip()
          out_file = "downloaded_vector.xml"
          downloaded = False

          match = re.search(r'[-\w]{25,}', raw_url)
          if match and ("drive.google.com" in raw_url or not raw_url.startswith("http")):
              try:
                  gdown.download(id=match.group(0), output=out_file, quiet=False)
                  if os.path.exists(out_file) and os.path.getsize(out_file) > 0:
                      downloaded = True
              except Exception as e:
                  print(f"Drive download failed: {e}")

          if not downloaded:
              try:
                  req = urllib.request.Request(raw_url, headers={'User-Agent': 'Mozilla/5.0'})
                  with urllib.request.urlopen(req) as resp, open(out_file, 'wb') as f:
                      f.write(resp.read())
                  if os.path.exists(out_file) and os.path.getsize(out_file) > 0:
                      downloaded = True
              except Exception as e:
                  print(f"Direct download failed: {e}")

          if not downloaded:
              print("ভেক্টর XML ডাউনলোড করা সম্ভব হয়নি। পরিবর্তন স্কিপ করা হলো।")
